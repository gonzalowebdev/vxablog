<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contenido del sitio | Admin</title>
    <meta name="robots" content="noindex, nofollow">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="../style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="font-[Quicksand] bg-[#fef9f2] min-h-screen">

    <div id="admin-header"></div>
    <div class="flex">
        <aside id="admin-sidebar" class="w-56 shrink-0 bg-white border-r border-amber-100 min-h-[calc(100vh-53px)] p-4 space-y-1"></aside>

        <main class="flex-1 min-w-0 p-4 md:p-6 max-w-2xl">
            <h1 class="text-xl font-bold text-gray-800 mb-1">Contenido del sitio</h1>
            <p class="text-sm text-gray-500 mb-6">Editá los textos de la página de Asesoría sin tocar código.</p>

            <form id="contenido-form" class="bg-white rounded-2xl p-6 shadow-sm space-y-4"></form>
        </main>
    </div>

    <script src="../js/supabase-client.js"></script>
    <script src="js/admin-auth.js"></script>
    <script src="js/admin-layout.js"></script>
    <script src="js/contenido.js"></script>
</body>
</html>
