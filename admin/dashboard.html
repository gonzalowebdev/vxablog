<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notas | Admin</title>
    <meta name="robots" content="noindex, nofollow">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="../style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="font-[Quicksand] bg-[#fef9f2] min-h-screen">

    <div id="admin-header"></div>
    <div class="flex">
        <aside id="admin-sidebar" class="w-56 shrink-0 bg-white border-r border-amber-100 min-h-[calc(100vh-53px)] p-4 space-y-1"></aside>

        <main class="flex-1 min-w-0 p-4 md:p-6 max-w-3xl">
            <div class="flex justify-between items-center mb-4">
                <h1 class="text-xl font-bold text-gray-800">Notas</h1>
                <a href="editor.html" class="bg-amber-500 hover:bg-amber-600 text-white text-sm font-semibold py-2 px-4 rounded-full transition">
                    <i class="fas fa-plus mr-1"></i> Nueva nota
                </a>
            </div>

            <div class="flex gap-2 mb-4">
                <select id="filtro-categoria" class="p-2 border border-gray-300 rounded-xl text-sm"></select>
                <select id="filtro-estado" class="p-2 border border-gray-300 rounded-xl text-sm">
                    <option value="">Todos los estados</option>
                    <option value="publicada">Publicadas</option>
                    <option value="borrador">Ocultas</option>
                </select>
            </div>

            <div id="lista-notas" class="space-y-2"></div>
        </main>
    </div>

    <script src="../js/categories.js"></script>
    <script src="../js/supabase-client.js"></script>
    <script src="js/admin-auth.js"></script>
    <script src="js/admin-layout.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
